name: 📱 Compilar APK de Android (Kpital)

on:
  push:
    branches: [ production, develop ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar dependencias Flutter
        run: |
          cd frontend
          flutter pub get

      - name: 🔨 Compilar APK Release
        run: |
          cd frontend
          flutter build apk --release

      - name: 📤 Subir instalador APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kpital-android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
